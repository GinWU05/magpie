<main><h1>#396 界面预览</h1><p class="m">commit 2dddcd5 · <a href="https://github.com/yetone/magpie/pull/396">回到 PR</a> · 在「路由」页的请求列表上加了「按请求 / 按会话」切换和按会话分组的标题行（Agent·会话名、请求数/token/进行中、会话估算合计），并给每条请求的 meta 加上按有效价格估算的费用（含缓存读写，货币切换后重绘）；后端把这些请求的会话 ID、父会话和 token 分档写进路由历史与 trace，并新增按 ID 读取 Codex 本地会话名的接口。</p>
